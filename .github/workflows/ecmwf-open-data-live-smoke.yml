name: ECMWF Open Data live integration smoke test

on:
  workflow_dispatch:
    inputs:
      model:
        description: "ECMWF model to test"
        required: true
        default: "ifs"
        type: choice
        options:
          - ifs
          - aifs-single
          - aifs-ens

permissions:
  contents: read

jobs:
  live-open-data:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install live download and GRIB conversion dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow pyproj scipy xarray cfgrib eccodes ecmwf-opendata

      - name: Download a small real ECMWF Open Data subset
        env:
          PYTHONPATH: src
          ECMWF_MODEL: ${{ inputs.model }}
        run: |
          mkdir -p output/ecmwf-open-data-live
          python -m ecmwf_collector.sources.ecmwf_open_data \
            --model "${ECMWF_MODEL}" \
            --resolution 0p25 \
            --time 0 \
            --step 24 \
            --param msl \
            --output output/ecmwf-open-data-live/latest.grib2

      - name: Convert real GRIB2 into map products and verify outputs
        env:
          PYTHONPATH: src
        run: |
          GRIB_FILE="$(find output/ecmwf-open-data-live -maxdepth 1 -type f -name '*.grib2' -print -quit)"
          test -n "$GRIB_FILE"
          python -m ecmwf_collector.tools.grib_to_map \
            "$GRIB_FILE" \
            --variable msl \
            --output-dir output/ecmwf-open-data-live/map
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("output/ecmwf-open-data-live")
          source_files = list(root.glob("*.grib2"))
          if len(source_files) != 1:
              raise SystemExit(f"Expected one downloaded GRIB2 file, found {len(source_files)}")
          source = source_files[0]
          sidecar = source.with_suffix(source.suffix + ".source.json")
          if not sidecar.is_file():
              raise SystemExit("ECMWF source sidecar is missing")
          report = json.loads(sidecar.read_text(encoding="utf-8"))
          if report.get("integrity") != "ok" or report.get("grib_edition") != "grib2":
              raise SystemExit(f"GRIB2 validation did not pass: {report}")
          if not report.get("returned_forecast_datetime"):
              raise SystemExit("ECMWF client did not report the actual forecast cycle")
          manifest_path = root / "map" / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          layers = [item for item in manifest.get("layers", []) if item.get("variable") == "msl"]
          if not layers:
              raise SystemExit("No msl map layers were generated from the live ECMWF file")
          for layer in layers:
              for key in ("image", "data_file"):
                  if not (manifest_path.parent / layer[key]).is_file():
                      raise SystemExit(f"Missing {key} output: {layer.get(key)}")
          summary = {
              "model": report["model"],
              "forecast_cycle": report["returned_forecast_datetime"],
              "source_bytes": report["size_bytes"],
              "message_count": report["message_count"],
              "sha256": report["sha256"],
              "map_layers": len(layers),
              "status": "passed",
          }
          (root / "live-validation-summary.json").write_text(
              json.dumps(summary, indent=2) + "\\n", encoding="utf-8"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload real ECMWF source and map products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecmwf-open-data-live-${{ inputs.model }}-${{ github.run_id }}
          path: output/ecmwf-open-data-live/
          if-no-files-found: warn
          retention-days: 14
