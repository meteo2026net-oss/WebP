name: WMO WIS2 real GRIB2 smoke test

on:
  push:
    branches:
      - feat/windows-one-click-desktop-package
    paths:
      - ".github/workflows/wmo-wis2-grib2-smoke.yml"
  pull_request:
    paths:
      - ".github/workflows/wmo-wis2-grib2-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wis2-real-grib2:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ecCodes decoder
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy eccodes requests

      - name: Resolve WIS2 discovery metadata and download a real WRF GRIB2 field
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from urllib.parse import urljoin

          import numpy as np
          import requests
          from eccodes import (
              codes_get,
              codes_get_values,
              codes_grib_new_from_file,
              codes_release,
          )

          record_id = "urn:wmo:md:cy-dom:weather.prediction.deterministic.local"
          metadata_url = (
              "https://wis2-gdc.weather.gc.ca/collections/"
              "wis2-discovery-metadata/items/"
              "urn:wmo:md:cy-dom:weather.prediction.deterministic.local?f=json"
          )
          session = requests.Session()
          session.headers.update({"User-Agent": "WebP-WIS2-GRIB2-validation/1.0"})

          metadata_response = session.get(metadata_url, timeout=30)
          metadata_response.raise_for_status()
          metadata = metadata_response.json()
          if metadata.get("id") != record_id:
              raise SystemExit(f"Unexpected WIS2 metadata record: {metadata.get('id')!r}")

          properties = metadata.get("properties", {})
          if properties.get("wmo:dataPolicy") != "core":
              raise SystemExit("The selected WIS2 dataset is not declared as core data")
          rights = str(properties.get("rights", "")).lower()
          if "free" not in rights or "unrestricted" not in rights:
              raise SystemExit("The WIS2 metadata does not declare free and unrestricted access")

          data_links = [
              link for link in metadata.get("links", [])
              if link.get("rel") == "data"
              and link.get("type") == "application/grib"
          ]
          if len(data_links) != 1:
              raise SystemExit(f"Expected one GRIB data link in WIS2 metadata; found {len(data_links)}")
          directory_url = data_links[0]["href"]
          if not directory_url.endswith("/"):
              directory_url += "/"

          output = Path("output/wmo-wis2")
          output.mkdir(parents=True, exist_ok=True)
          (output / "wcmp2-record.json").write_text(
              json.dumps(metadata, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )

          filename = "WRF_T2m.grb"
          source_url = urljoin(directory_url, filename)
          response = session.get(source_url, timeout=90)
          response.raise_for_status()
          payload = response.content
          if len(payload) < 100_000:
              raise SystemExit(f"Downloaded WIS2 GRIB file is unexpectedly small: {len(payload)} bytes")
          if payload[:4] != b"GRIB" or payload[7] != 2:
              raise SystemExit("Downloaded WIS2 file does not have a GRIB2 edition-2 header")
          if b"7777" not in payload[-64:]:
              raise SystemExit("Downloaded WIS2 file is missing the GRIB end marker near EOF")

          grib_path = output / filename
          grib_path.write_bytes(payload)
          digest = hashlib.sha256(payload).hexdigest()
          (output / "SHA256SUMS.txt").write_text(
              f"{digest}  {filename}\n", encoding="ascii"
          )

          inventory = []
          finite_value_count = 0
          with grib_path.open("rb") as stream:
              while True:
                  handle = codes_grib_new_from_file(stream)
                  if handle is None:
                      break
                  try:
                      row = {"file": filename}
                      for key in (
                          "edition", "centre", "shortName", "name", "paramId",
                          "typeOfLevel", "level", "units", "gridType",
                          "dataDate", "dataTime", "stepType", "stepRange",
                          "Ni", "Nj", "numberOfPoints",
                      ):
                          try:
                              row[key] = codes_get(handle, key)
                          except Exception:
                              row[key] = None

                      values = np.asarray(codes_get_values(handle), dtype=float)
                      finite = int(np.isfinite(values).sum())
                      if finite < 1:
                          raise SystemExit(f"GRIB message has no finite decoded values: {row}")
                      row["decoded_value_count"] = int(values.size)
                      row["finite_value_count"] = finite
                      row["minimum_value"] = float(np.nanmin(values))
                      row["maximum_value"] = float(np.nanmax(values))
                      finite_value_count += finite
                      inventory.append(row)
                  finally:
                      codes_release(handle)

          if not inventory:
              raise SystemExit("ecCodes did not decode any GRIB messages")
          if any(row["edition"] != 2 for row in inventory):
              raise SystemExit("At least one decoded message is not GRIB edition 2")
          temperature_fields = [
              row for row in inventory
              if row.get("shortName") in {"2t", "t2m"}
              and row.get("typeOfLevel") == "heightAboveGround"
              and row.get("level") == 2
          ]
          if not temperature_fields:
              raise SystemExit(
                  "The WRF_T2m file decoded, but no 2-metre temperature field "
                  "at heightAboveGround level 2 was found"
              )

          (output / "grib-inventory.json").write_text(
              json.dumps(inventory, indent=2) + "\n", encoding="utf-8"
          )
          summary = {
              "source": "WMO WIS2 Global Discovery Catalogue",
              "wcmp2_record_id": record_id,
              "dataset_title": properties.get("title"),
              "producer": "Cyprus Department of Meteorology",
              "model": "WRF-ARW",
              "data_policy": properties.get("wmo:dataPolicy"),
              "file": filename,
              "source_url": source_url,
              "size_bytes": len(payload),
              "sha256": digest,
              "grib_edition": 2,
              "decoded_message_count": len(inventory),
              "finite_decoded_values": finite_value_count,
              "validated_2m_temperature_messages": len(temperature_fields),
              "workflow": "real WIS2-linked data smoke test; not scientific forecast verification",
          }
          (output / "validation-summary.json").write_text(
              json.dumps(summary, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(summary, indent=2))
          PY

      - name: Upload WIS2 metadata, real GRIB2 and decode evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wmo-wis2-real-grib2-${{ github.run_id }}
          path: output/wmo-wis2/
          if-no-files-found: warn
          retention-days: 14
