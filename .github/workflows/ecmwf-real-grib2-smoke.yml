name: ECMWF real GRIB2 smoke test

on:
  workflow_dispatch:
    inputs:
      variable:
        description: "Exact cfgrib variable to convert"
        required: true
        default: "msl"
        type: string

permissions:
  contents: read

jobs:
  real-grib2-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install GRIB decoding and map dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy Pillow pyproj scipy xarray cfgrib eccodes

      - name: Download the pinned public ECMWF GRIB2 sample
        run: |
          mkdir -p output/ecmwf-real
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://data.ecmwf.int/mtg2_sample/od/oper/fc/sfc/151_od_oper_fc_sfc_msl_2024_0001_regular_ll.grib2" \
            --output output/ecmwf-real/sample.grib2
          python - <<'PY'
          from pathlib import Path
          p = Path("output/ecmwf-real/sample.grib2")
          data = p.read_bytes()
          if len(data) < 1_000_000:
              raise SystemExit(f"Downloaded file is unexpectedly small: {len(data)} bytes")
          if b"GRIB" not in data[:64]:
              raise SystemExit("GRIB magic marker was not found near the beginning of the file")
          if b"7777" not in data[-64:]:
              raise SystemExit("GRIB end marker was not found near the end of the file")
          print(f"Validated GRIB2 container: {p.stat().st_size:,} bytes")
          PY
          sha256sum output/ecmwf-real/sample.grib2 | tee output/ecmwf-real/SHA256SUMS.txt

      - name: Inventory real GRIB messages
        env:
          PYTHONPATH: src
          SELECTED_VARIABLE: ${{ inputs.variable }}
        run: |
          python -m ecmwf_collector.tools.inspect_grib \
            output/ecmwf-real/sample.grib2 \
            --output output/ecmwf-real/inventory.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path("output/ecmwf-real/inventory.json").read_text())
          messages = report["messages"]
          if report["message_count"] < 1:
              raise SystemExit("No GRIB messages were decoded")
          editions = {m.get("edition") for m in messages}
          if editions != {2}:
              raise SystemExit(f"Expected a GRIB2-only fixture, found editions: {sorted(str(x) for x in editions)}")
          short_names = {m.get("shortName") for m in messages if m.get("shortName")}
          selected_variable = os.environ.get("SELECTED_VARIABLE", "msl")
          if "msl" not in short_names:
              raise SystemExit(f"Expected mean-sea-level pressure shortName 'msl'; found: {sorted(short_names)}")
          if selected_variable not in short_names:
              raise SystemExit(
                  f"Requested variable {selected_variable!r} is not present in this pinned sample; "
                  f"available short names: {sorted(short_names)}"
              )
          print(f"ecCodes decoded {report['message_count']} GRIB2 message(s)")
          print("Short names:", sorted(short_names))
          print("Grid types:", sorted({str(m.get("gridType")) for m in messages}))
          PY

      - name: Convert the selected real field into map products
        env:
          PYTHONPATH: src
          SELECTED_VARIABLE: ${{ inputs.variable }}
        run: |
          python -m ecmwf_collector.tools.grib_to_map \
            output/ecmwf-real/sample.grib2 \
            --variable "${SELECTED_VARIABLE}" \
            --output-dir output/ecmwf-real/map
          python - <<'PY'
          import json
          import os
          import numpy as np
          from PIL import Image
          from pathlib import Path
          selected_variable = os.environ["SELECTED_VARIABLE"]
          root = Path("output/ecmwf-real/map")
          manifest = json.loads((root / "manifest.json").read_text())
          layers = manifest.get("layers", [])
          if not layers:
              raise SystemExit("Conversion produced no manifest layers")
          selected = [layer for layer in layers if layer.get("variable") == selected_variable]
          if not selected:
              raise SystemExit("The real GRIB2 conversion did not produce the requested variable")
          for layer in selected:
              for key in ("image", "data_file"):
                  name = layer.get(key)
                  if not name or not (root / name).is_file():
                      raise SystemExit(f"Missing {key} output for layer: {layer}")
              if layer.get("units") in (None, "", "unknown"):
                  raise SystemExit(f"Real {selected_variable} layer has no declared source unit: {layer}")
              image_path = root / layer["image"]
              with Image.open(image_path) as image:
                  image.verify()
              with Image.open(image_path) as image:
                  if image.format != "PNG" or image.mode != "RGBA" or min(image.size) < 2:
                      raise SystemExit(f"Unexpected display image format/mode/size: {image_path}")
              with np.load(root / layer["data_file"], allow_pickle=False) as data:
                  required_arrays = {"values", "latitudes", "longitudes"}
                  if not required_arrays.issubset(data.files):
                      raise SystemExit(f"NPZ is missing required arrays: {image_path}")
                  values = data["values"]
                  latitudes = data["latitudes"]
                  longitudes = data["longitudes"]
                  regular_1d = (
                      latitudes.ndim == 1 and longitudes.ndim == 1
                      and len(latitudes) == values.shape[0]
                      and len(longitudes) == values.shape[1]
                  )
                  curvilinear_2d = (
                      latitudes.ndim == 2 and longitudes.ndim == 2
                      and latitudes.shape == values.shape
                      and longitudes.shape == values.shape
                  )
                  if values.ndim != 2 or not (regular_1d or curvilinear_2d):
                      raise SystemExit(f"Unexpected value/geolocation shapes in {layer['data_file']}")
                  if latitudes.ndim == 1:
                      geo_valid = (np.isfinite(latitudes)[:, None]
                                   & np.isfinite(longitudes)[None, :]
                                   & (np.abs(latitudes[:, None]) <= 90.0))
                  else:
                      geo_valid = (np.isfinite(latitudes) & np.isfinite(longitudes)
                                   & (np.abs(latitudes) <= 90.0))
                  if int(geo_valid.sum()) < 3:
                      raise SystemExit(f"Too few valid geolocation cells in {layer['data_file']}")
                  if int((geo_valid & np.isfinite(values)).sum()) < 3:
                      raise SystemExit(f"Too few finite source values with valid geolocation in {layer['data_file']}")
          (Path("output/ecmwf-real") / "validation-summary.json").write_text(
              json.dumps({
                  "fixture": "ECMWF static GRIB2 sample",
                  "requested_variable": selected_variable,
                  "manifest_layer_count": len(layers),
                  "validated_selected_layer_count": len(selected),
                  "validated_outputs": ["PNG", "NPZ", "manifest"],
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"Validated {len(selected)} real {selected_variable} layer(s), source values, geolocation, PNG and NPZ outputs")
          PY

      - name: Upload inventory, checksum and generated map products
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ecmwf-real-grib2-smoke-${{ github.run_id }}
          path: output/ecmwf-real/
          if-no-files-found: warn
          retention-days: 14
