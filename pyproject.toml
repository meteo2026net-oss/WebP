[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecmwf-webp-weather"
version = "0.2.0"
description = "ECMWF data collector and GRIB-to-WebP weather processing tools"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["PySide6>=6.7", "keyring>=25.0", "numpy>=1.26", "Pillow>=10.0", "xarray>=2024.1", "cfgrib>=0.9.15", "eccodes>=2.36", "pandas>=2.2", "pyproj>=3.6", "scipy>=1.11", "psycopg[binary]>=3.2", "ecmwf-opendata"]

[project.optional-dependencies]
review-server = ["PyJWT[crypto]>=2.10", "psycopg_pool>=3.2", "gunicorn>=23.0"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
